<!-- HEADER -->
<header class="mb-10 pb-6 border-b border-slate-800/80">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5">

        <!-- Logo / Brand -->
        <div>
            {% if page.url != "/" and page.url != "/index.html" %}
            <a href="{{ '/' | relative_url }}" class="group block">
                <div class="flex items-center gap-3">
                    <!-- Icon -->
                    <div class="w-9 h-9 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center flex-shrink-0 group-hover:bg-blue-500/20 transition-colors duration-300">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
                        </svg>
                    </div>
                    <!-- Title -->
                    <div>
                        <h1 class="font-mono text-base font-bold text-slate-100 group-hover:text-blue-400 transition-colors duration-300 leading-none">
                            <span class="text-blue-500/70">root@</span>hideonn1<span class="text-blue-500/70">:~#</span>
                        </h1>
                        <p class="text-xs text-slate-500 font-sans mt-0.5">{{ site.description }}</p>
                    </div>
                </div>
            </a>
            {% else %}
            <div class="block select-none">
                <div class="flex items-center gap-3">
                    <!-- Icon -->
                    <div class="w-9 h-9 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
                        </svg>
                    </div>
                    <!-- Title -->
                    <div>
                        <h1 class="font-mono text-base font-bold text-slate-100 leading-none">
                            <span class="text-blue-500/70">root@</span>hideonn1<span class="text-blue-500/70">:~#</span>
                        </h1>
                        <p class="text-xs text-slate-500 font-sans mt-0.5">{{ site.description }}</p>
                    </div>
                </div>
            </div>
            {% endif %}
        </div>

        <!-- Navigation -->
        {% if page.url != "/" and page.url != "/index.html" %}
        <nav class="flex items-center gap-2 font-mono text-xs">
            <a href="{{ '/' | relative_url }}"
               class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-slate-900/80 border border-slate-700/60 text-slate-400 hover:text-blue-400 hover:border-blue-500/40 hover:bg-blue-500/5 transition-all duration-200">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                /inicio
            </a>
        </nav>
        {% endif %}

    </div>
</header>
