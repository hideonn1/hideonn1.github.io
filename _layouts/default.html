<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        /* Estilos modernos */
        body { 
            background-color: #0b0e14; 
            color: #d1d5db; 
            font-family: 'Inter', -apple-system, sans-serif;
            line-height: 1.7; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 40px 20px;
        }
    
        article { 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 { color: #ffffff; font-size: 2.2em; letter-spacing: -0.02em; }
        h2 { color: #58a6ff; font-size: 1.6em; margin-top: 2em; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.9em; }
    
        .meta-data { 
            font-family: 'Fira Code', monospace; 
            background: #0d1117; 
            padding: 10px; 
            border-left: 4px solid #58a6ff;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        code { background: #0d1117; color: #f85149; padding: 2px 6px; border-radius: 4px; }
    
        a { color: #58a6ff; transition: 0.3s; }
        a:hover { color: #ffffff; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{{ '/' | relative_url }}" style="color: #58a6ff; text-decoration: none;">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
    </header>
    
    <main>
        {{ content }}
    </main>

    <footer>
        <p>Preparado por hideonn1 | <a href="https://github.com/hideonn1" style="color: #f85149;">GitHub</a></p>
    </footer>
</body>
</html>
