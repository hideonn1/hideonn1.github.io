<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0e14',
                        darkCard: '#161b22',
                        accent: '#58a6ff'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-300 font-sans leading-relaxed">
    <main class="max-w-3xl mx-auto p-6 md:p-10">
        {{ content }}

        <div class="mt-12 pt-8 border-t border-gray-700">
            <a href="{{ '/' | relative_url }}"
               class="inline-flex items-center text-accent hover:text-white transition-colors duration-300 font-medium">
               <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>     
               </svg>
               Volver a la biblioteca
            </a>
        </div>
    </main>
</body>
</html>
