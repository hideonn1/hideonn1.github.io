<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6; 
            max-width: 800px;
            margin: 40px auto; 
            padding: 0 20px;
        }
        header { border-bottom: 2px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #58a6ff; font-size: 2em; margin-bottom: 0.2em; }
        h2 { color: #f85149; font-size: 1.5em; margin-top: 1.5em; border-bottom: 1px solid #30363d; }
        h3 { color: #c9d1d9; font-size: 1.2em; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        footer { margin-top: 60px; font-size: 0.85em; color: #8b949e; border-top: 1px solid #30363d; padding-top: 20px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{{ '/' | relative_url }}" style="color: #58a6ff; text-decoration: none;">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
    </header>
    
    <main>
        {{ content }}
    </main>

    <footer>
        <p>Preparado por hideonn1 | <a href="https://github.com/hideonn1" style="color: #f85149;">GitHub</a></p>
    </footer>
</body>
</html>
